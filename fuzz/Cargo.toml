# libFuzzer targets for the decoders of everything that comes from outside; see
# docs/fuzzing.md. A workspace of its own, with its own Cargo.lock, so the main workspace's
# builds, checks and dependency audit never see libfuzzer-sys or the nightly toolchain.
[package]
name = "fogata-fuzz"
version = "0.0.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
fogata-core = { path = "../crates/fogata-core", features = ["fuzzing"] }

[workspace]

# The same patches as the main workspace's (tools/check.sh compares both lists), so the targets
# fuzz the code that ships.
[patch.crates-io]
libp2p-quic = { path = "../vendor/libp2p-quic" }
libp2p-mdns = { path = "../vendor/libp2p-mdns" }
libp2p-identify = { path = "../vendor/libp2p-identify" }
libp2p-stream = { path = "../vendor/libp2p-stream" }
turn = { path = "../vendor/turn" }
spake2 = { path = "../vendor/spake2" }

[profile.release]
debug = 1

[[bin]]
name = "entry"
path = "fuzz_targets/entry.rs"
test = false
doc = false
bench = false

[[bin]]
name = "log"
path = "fuzz_targets/log.rs"
test = false
doc = false
bench = false

