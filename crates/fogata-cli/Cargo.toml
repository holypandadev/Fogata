[package]
name = "fogata"
description = "Command-line client for Fogata"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
base64.workspace = true
clap.workspace = true
fogata-core.workspace = true
fogata-crypto.workspace = true
fogata-friends.workspace = true
fogata-media.workspace = true
fogata-net.workspace = true
fogata-proto.workspace = true
fogata-state.workspace = true
fogata-update.workspace = true
hex.workspace = true
qrcode.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
zeroize.workspace = true

# The free space of a disk (statvfs, without unsafe code here), so that a restore or a move
# there is no room for is refused before anything is written.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.5", default-features = false, features = ["std", "fs"] }

[features]
# The network lab's tools and test switches (every lab-* subcommand and --lab-* flag, release
# --lab): left out of the program that ships. tools/netlab/netlab.sh builds its own copy with
# this feature, and tools/check.sh tests and lints it with it.
lab = ["fogata-core/lab"]

[lints]
workspace = true
