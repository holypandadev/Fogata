# Kept on aws-lc-rs: libp2p-tls (rustls with aws-lc-rs and prefer-post-quantum) calls aws-lc-rs
# itself and makes every QUIC handshake offer the post-quantum X25519MLKEM768 exchange, which
# ring cannot do. With quinn on rustls-ring alone aws-lc-sys is still built
# (`cargo tree -i aws-lc-sys -e features` names libp2p-tls), so only a fork of libp2p-tls on
# ring would drop it, and with it that exchange.
[dependencies.quinn]
version = "0.11"
features = [
    "rustls-aws-lc-rs",
    "futures-io",
]
default-features = false

[dependencies.quinn-proto]
version = "0.11"
features = [
    "bloom",
    "log",
    "ring",
]
default-features = false

