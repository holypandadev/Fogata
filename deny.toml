# Dependency policy. Licences: only permissive ones, which Fogata's licence (AGPL-3.0-only) can
# take in and which keep the code usable however it is shipped.
[graph]
all-features = true

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

# allo-isolate 0.1.27 (flutter_rust_bridge) has no `license` field, only license-file = "LICENSE",
# which is the Apache-2.0 text. Pinned, so that a changed file is noticed.
[[licenses.clarify]]
name = "allo-isolate"
version = "0.1.27"
expression = "Apache-2.0"
license-files = [{ path = "LICENSE", hash = 0x0a6d4ed6 }]

[licenses.private]
ignore = true

# Where crates may come from: crates.io only. The vendored crates are path dependencies.
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[bans]
# A version requirement of "*" could take any future release.
wildcards = "deny"
allow-wildcard-paths = true
# Two versions of one crate are reported, not refused: many come from libp2p and the WebRTC
# crates and cannot be unified from here. Among them, two generations of the RustCrypto and
# dalek crates: Fogata's own code is on the new one (curve25519-dalek 5, sha2 0.11, hkdf 0.13,
# chacha20poly1305 0.11, rand 0.10); the old one (curve25519-dalek 4, sha2/digest/hmac 0.10
# and 0.12, hkdf 0.12, chacha20poly1305/aead 0.10, blake2 0.10, rand_core 0.6) comes from
# two places only:
#   - snow 0.10 (libp2p's Noise handshake, through libp2p-noise 0.47; with aes-gcm 0.10 and
#     blake2 0.10), whose newest release is still on it: it goes when libp2p takes a snow on
#     the new crates;
#   - the vendored spake2 0.4.0 (vendor/spake2), alone in pulling curve25519-dalek 4, hkdf 0.12
#     and rand_core 0.6: only spake2 0.5.0-pre.0 (a pre-release) is on the new crates. Moving
#     the fork to it, or porting the fork, changes the code that runs every friend and move
#     code: done on its own, with the tests of crates/fogata-friends against beta.8's
#     handshakes, never as a lockfile bump.
# (rand 0.9 is the WebRTC crates' own: stun, webrtc-util and the vendored turn.)
# `cargo tree -d` lists them, `cargo tree -i <crate>@<version>` says what pulls each.
multiple-versions = "warn"

# Known vulnerabilities, from the RustSec advisory database kept on this computer. It is
# fetched by hand (`cargo deny fetch db`); the checks never go online for it.
[advisories]
version = 2
db-path = "$CARGO_HOME/advisory-dbs"
db-urls = ["https://github.com/rustsec/advisory-db"]
# A crate no longer maintained is only an error when Fogata uses it itself; deeper in the
# tree (paste through if-watch, zbus' zvariant pieces through keyring) it waits for those
# crates to move, and vulnerabilities fail whatever the depth.
unmaintained = "workspace"
# A crate version its authors yanked (usually for a bug or a security hole) is refused: Cargo.lock
# must move off it. Checked against the crates.io index cargo fetched.
yanked = "deny"
