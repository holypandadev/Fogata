# The interface's words: lib/l10n/app_<language>.arb, made into Dart by `flutter gen-l10n`
# (also run by `flutter pub get`). See docs/translating.md.
arb-dir: lib/l10n
template-arb-file: app_en.arb
output-localization-file: app_localizations.dart
output-class: L10n
nullable-getter: false
required-resource-attributes: true
format: true
