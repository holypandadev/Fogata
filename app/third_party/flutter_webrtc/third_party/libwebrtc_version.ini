# libwebrtc for Linux and Windows: Fogata's own build of WebRTC M156 with webrtc-sdk's C++
# wrapper, made by tools/webrtc (see its README.md).
# These archives are not published: each computer that builds the app takes them from its
# store, <home>/fogata-libwebrtc/<binary_version>/<asset>.zip (FOGATA_LIBWEBRTC_DIR names
# another folder), where tools/webrtc puts what it builds. FOGATA_LIBWEBRTC_ARCHIVE names
# one archive instead. Once they are published, `download_url` names the base
# release-download URL (third_party/CMakeLists.txt appends the version, asset and `.zip`).
# `sha256_<os>-<arch>` is the archive's SHA-256: an archive that does not match is refused.
[libwebrtc]
binary_version = fogata-libwebrtc.m156.8078.5
sha256_linux-x64   = a4d6108356b4ac43cff87ffb31e2b5a6a3093b165976caca716ca3102e427867
sha256_win-x64     = 820a4710acaa03d0a931ac6903a31a060ceb1c8b8576e1590e338a1d95110506
