# libwebrtc for Linux and Windows: Fogata's own build of WebRTC M156 with webrtc-sdk's C++
# wrapper, made by tools/webrtc (see its README.md).
# A computer that builds the app takes them from its store,
# <home>/fogata-libwebrtc/<binary_version>/<asset>.zip (FOGATA_LIBWEBRTC_DIR names another
# folder), where tools/webrtc puts what it builds; FOGATA_LIBWEBRTC_ARCHIVE names one archive
# instead. Without one there, it downloads the archive published at `download_url`, the base
# release-download URL of holypandadev/fogata-libwebrtc (third_party/CMakeLists.txt appends
# the version, asset and `.zip`).
# `sha256_<os>-<arch>` is the archive's SHA-256: an archive that does not match is refused.
[libwebrtc]
binary_version = fogata-libwebrtc.m156.8078.6
download_url = https://github.com/holypandadev/fogata-libwebrtc/releases/download
sha256_linux-x64   = 616a2660cbff3f1e77a1503ccbe274b65768b198292015bc16cae3f7079fe78f
sha256_win-x64     = 7bee9c1071cc061e443442ea18c1ba4356ef3e34eec591a23d75605fcc247641
