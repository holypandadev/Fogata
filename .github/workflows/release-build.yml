# The release builds of a pre-release, made on GitHub's computers so that anyone can check
# where they came from (docs/releasing-beta.md, "A release"):
#
#   source   the commit to build: the run's own (github.sha), which is the commit GitHub's
#            attestations name; by hand the commit given must be it, and on a tag the tag
#            must be v<THIS_VERSION>. And the team pinned into the macOS updater, first, so
#            that a run without one stops before anything is built.
#   linux    `flutter build linux --release`, the bundle zipped with its links and modes.
#   windows  `flutter build windows --release`, the contents of runner\Release zipped.
#   macos    `flutter build macos --release` (universal) and the updater helper
#            (tools/beta/macos-updater.sh, with the team pinned in), NOT signed by the
#            release identity: the Mac signs it afterwards with tools/sign-macos.sh.
#   attest   the SHA-256 of the three, and a build provenance attestation of each, signed for
#            this workflow and this commit by GitHub (Sigstore).
#
# Each build checks that its library's commit marker is this commit with no changes, and
# then what release.py checks before it packs a build (tools/beta/ci_builds.py check-build:
# a release build, the hardening of every Linux and Windows program and library, the Mac app
# universal and of this build), so that a run release.py would refuse fails here. Each writes
# what it was built with (tools/toolchain.sh) to the run's summary and to
# toolchain-<system>.txt beside its zip, outside it, which ci_builds.py fetches with it.
# The macOS build uses the Xcode of XCODE_VERSION and the CocoaPods of Podfile.lock. Nothing here holds a key: release.py signs on the owner's
# computer, from builds that tools/beta/ci_builds.py fetches and verifies. No cache is
# restored, so nothing an earlier run left can get into a release. The token reads only;
# the attest job alone may mint the token that signs attestations, and runs none of the
# build's code. The builds are kept 90 days, the most a public repository may keep them:
# release.py --ci-builds checks that what it ships is them, and puts them beside the release,
# where they stay for as long as it does (docs/releasing-beta.md).
name: Release build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      commit:
        description: The full commit to build; must be the commit of the branch or tag the run is started on
        required: true
      macos_team:
        description: The team id pinned into the macOS updater (the OU of the signing certificate); by default the variable FOGATA_MACOS_TEAM
        default: ""

permissions:
  contents: read

concurrency:
  group: release-build-${{ github.sha }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  # The same Flutter and Xcode as .github/workflows/ci.yml.
  FLUTTER_VERSION: 3.47.8
  XCODE_VERSION: "16.4"
  CARGO_TERM_COLOR: never

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      macos_team: ${{ steps.team.outputs.team }}
    steps:
      # The updater helper is built with the team that must sign every new version pinned
      # into it (tools/beta/macos-updater.sh --team), and tools/sign-macos.sh refuses to sign
      # it with another team. The team id is no secret (every signature names it). Checked
      # first, so that a run without it (a tag push takes it only from the repository
      # variable) stops in seconds rather than after Linux and Windows have built.
      - name: Check the team
        id: team
        env:
          TEAM: ${{ inputs.macos_team || vars.FOGATA_MACOS_TEAM }}
        run: |
          [[ $TEAM =~ ^[A-Z0-9]{10}$ ]] || {
            echo "::error::no team id for the macOS updater: give macos_team, or set the repository variable FOGATA_MACOS_TEAM (a tag push can only take it from there)"
            exit 1
          }
          echo "team=$TEAM" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the commit and the version
        env:
          EXPECTED: ${{ inputs.commit }}
        run: |
          if [[ $GITHUB_EVENT_NAME == workflow_dispatch && $EXPECTED != "$GITHUB_SHA" ]]; then
            echo "::error::the run is on $GITHUB_SHA, not $EXPECTED: start it on the branch or tag of that commit"
            exit 1
          fi
          version=$(sed -n 's/^pub const THIS_VERSION: &str = "\(.*\)";$/\1/p' crates/fogata-update/src/lib.rs)
          build=$(sed -n 's/^pub const THIS_BUILD: u64 = \([0-9]*\);$/\1/p' crates/fogata-update/src/lib.rs)
          [[ -n $version && -n $build ]] || { echo "::error::cannot read THIS_VERSION and THIS_BUILD"; exit 1; }
          if [[ $GITHUB_REF_TYPE == tag && $GITHUB_REF_NAME != "v$version" ]]; then
            echo "::error::the tag is $GITHUB_REF_NAME, the source says $version"
            exit 1
          fi
          echo "Building $GITHUB_SHA: build $build, $version" >> "$GITHUB_STEP_SUMMARY"

  linux:
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Make room on the disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /usr/share/swift /opt/hostedtoolcache/CodeQL
          df -h /

      # The build packages of the CI job (.github/workflows/ci.yml), without those its tests
      # need at run time.
      - name: Install the system packages
        timeout-minutes: 20
        run: |
          # GitHub's image tries Azure's mirror of Ubuntu first. When it does not answer
          # (its name not resolving, or resolving to nothing that answers), apt neither
          # gives up nor goes on to the next mirror in good time: one job sat here for two
          # hours. So the mirror is asked first and left out when it gives nothing within
          # 15 s, and apt itself waits at most 30 s for anything.
          codename=$(. /etc/os-release && echo "$VERSION_CODENAME")
          curl -fsS --max-time 15 -o /dev/null \
              "http://azure.archive.ubuntu.com/ubuntu/dists/$codename/InRelease" || {
            [[ ! -f /etc/apt/apt-mirrors.txt ]] ||
              sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
          }
          apt="sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          $apt update
          $apt install -y --no-install-recommends \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libasound2-dev libpulse-dev libpipewire-0.3-dev zip

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: false

      - name: Install the Rust of rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install

      # release.py clears these for its own Linux build (BUILD_ENV_CLEARED): they change what
      # the compilers make, and its hardening checks would refuse what they drop.
      - name: Check the build's environment
        run: |
          for name in RUSTFLAGS CARGO_ENCODED_RUSTFLAGS RUSTC_WRAPPER CFLAGS CXXFLAGS LDFLAGS \
              CMAKE CARGO_BUILD_TARGET CARGO_TARGET_DIR; do
            [[ -z ${!name+x} ]] || { echo "::error::$name is set"; exit 1; }
          done

      - name: Build the application
        run: |
          cd app
          flutter pub get
          flutter build linux --release

      - name: Record the toolchain
        if: always()
        run: |
          tools/toolchain.sh linux > toolchain-linux.txt
          { echo '### Toolchain (linux)'; echo '```'; cat toolchain-linux.txt; echo '```'; } |
            tee -a "$GITHUB_STEP_SUMMARY"

      - name: Check the commit marker
        run: |
          # What the release build reads (fogata-update's build.rs): a change there is +dirty.
          git status --porcelain --untracked-files=normal -- crates vendor app Cargo.toml \
            Cargo.lock .cargo rust-toolchain.toml
          python3 -I tools/beta/ci_builds.py check-marker app/build/linux/x64/release/bundle "$GITHUB_SHA"

      - name: Check the build as release.py will
        run: python3 -I -B tools/beta/ci_builds.py check-build linux app/build/linux/x64/release/bundle

      # zip -y keeps links as links; release.py's unzip keeps them and the modes.
      - name: Zip the bundle
        run: |
          cd app/build/linux/x64/release
          zip -q -r -y -X "$GITHUB_WORKSPACE/Fogata-linux-x64-bundle.zip" bundle

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fogata-linux-x64
          path: |
            Fogata-linux-x64-bundle.zip
            toolchain-linux.txt
          if-no-files-found: error
          retention-days: 90

  windows:
    needs: source
    runs-on: windows-2025
    timeout-minutes: 150
    steps:
      # As in ci.yml: line endings as committed, or the clone has changes and the marker
      # says +dirty.
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: false

      - name: Install the Rust of rust-toolchain.toml
        shell: pwsh
        run: |
          rustup show active-toolchain
          if ($LASTEXITCODE -ne 0) { rustup toolchain install }
          exit $LASTEXITCODE

      # What would drop the mitigations release.py checks every .exe and .dll for.
      - name: Check the build's environment
        shell: pwsh
        run: |
          foreach ($name in @('RUSTFLAGS', 'CARGO_ENCODED_RUSTFLAGS', 'RUSTC_WRAPPER', 'CFLAGS',
                              'CXXFLAGS', 'LDFLAGS', 'CL', '_CL_', 'LINK', '_LINK_',
                              'CARGO_BUILD_TARGET', 'CARGO_TARGET_DIR')) {
            if (Test-Path "env:$name") { Write-Output "::error::$name is set"; exit 1 }
          }

      - name: Build the application
        shell: pwsh
        working-directory: app
        run: |
          flutter pub get
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter build windows --release
          exit $LASTEXITCODE

      - name: Record the toolchain
        if: always()
        run: |
          tools/toolchain.sh windows app/build/windows/x64 > toolchain-windows.txt
          { echo '### Toolchain (windows)'; echo '```'; cat toolchain-windows.txt; echo '```'; } |
            tee -a "$GITHUB_STEP_SUMMARY"

      - name: Check the commit marker
        run: |
          # What the release build reads (fogata-update's build.rs): a change there is +dirty.
          git status --porcelain --untracked-files=normal -- crates vendor app Cargo.toml \
            Cargo.lock .cargo rust-toolchain.toml
          python -I tools/beta/ci_builds.py check-marker app/build/windows/x64/runner/Release "$GITHUB_SHA"

      - name: Check the build as release.py will
        run: python -I -B tools/beta/ci_builds.py check-build windows app/build/windows/x64/runner/Release

      # As docs/releasing-beta.md says: the contents of Release, not the folder.
      - name: Zip the application
        shell: pwsh
        run: |
          Compress-Archive -Path app\build\windows\x64\runner\Release\* -DestinationPath Fogata-windows-x64.zip

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fogata-windows-x64
          path: |
            Fogata-windows-x64.zip
            toolchain-windows.txt
          if-no-files-found: error
          retention-days: 90

  macos:
    needs: source
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # As in ci.yml: DEVELOPER_DIR, which xcode-select, xcodebuild, xcrun and Flutter follow.
      - name: Use the Xcode of XCODE_VERSION
        run: |
          xcode=/Applications/Xcode_$XCODE_VERSION.app
          [[ -d $xcode ]] || {
            echo "::error::no $xcode on this image; it has: $(ls -d /Applications/Xcode_*.app | xargs -n1 basename | tr '\n' ' ')"
            exit 1
          }
          echo "DEVELOPER_DIR=$xcode/Contents/Developer" >> "$GITHUB_ENV"

      # As in ci.yml: the CocoaPods that wrote Podfile.lock, which writes the Pods project.
      - name: Use the CocoaPods of Podfile.lock
        run: |
          version=$(sed -n 's/^COCOAPODS: \([0-9.]*\)$/\1/p' app/macos/Podfile.lock)
          [[ -n $version ]] || { echo "::error::Podfile.lock names no CocoaPods version"; exit 1; }
          gem install --user-install --no-document cocoapods -v "$version"
          bin=$RUNNER_TEMP/cocoapods-bin
          mkdir -p "$bin"
          printf '#!/bin/sh\nexec "%s/bin/pod" _%s_ "$@"\n' "$(ruby -e 'print Gem.user_dir')" "$version" > "$bin/pod"
          chmod +x "$bin/pod"
          [[ $("$bin/pod" --version) == "$version" ]] || { echo "::error::pod is not $version"; exit 1; }
          echo "$bin" >> "$GITHUB_PATH"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: false

      # The build is universal: the Rust library is built for both Mac targets.
      - name: Install the Rust of rust-toolchain.toml
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Check the build's environment
        run: |
          for name in RUSTFLAGS CARGO_ENCODED_RUSTFLAGS RUSTC_WRAPPER CFLAGS CXXFLAGS LDFLAGS \
              CMAKE CARGO_BUILD_TARGET CARGO_TARGET_DIR; do
            [[ -z ${!name+x} ]] || { echo "::error::$name is set"; exit 1; }
          done

      # Signed by Xcode to run here only (ad hoc); tools/sign-macos.sh signs every part again
      # with the release identity on the Mac.
      - name: Build the application and the updater
        env:
          # Checked by the source job.
          FOGATA_MACOS_TEAM: ${{ needs.source.outputs.macos_team }}
        run: |
          (cd app && flutter pub get && flutter build macos --release)
          tools/beta/macos-updater.sh --team "$FOGATA_MACOS_TEAM"

      - name: Record the toolchain
        if: always()
        run: |
          tools/toolchain.sh macos > toolchain-macos.txt
          { echo '### Toolchain (macos)'; echo '```'; cat toolchain-macos.txt; echo '```'; } |
            tee -a "$GITHUB_STEP_SUMMARY"

      - name: Check the commit marker
        run: |
          app=app/build/macos/Build/Products/Release/Fogata.app
          # What the release build reads (fogata-update's build.rs): a change there is +dirty,
          # but for Podfile.lock, which CocoaPods writes again (shown, for the record).
          git status --porcelain --untracked-files=normal -- crates vendor app Cargo.toml \
            Cargo.lock .cargo rust-toolchain.toml
          git diff -- app/macos/Podfile.lock
          python3 -I tools/beta/ci_builds.py check-marker "$app" "$GITHUB_SHA"

      # Every Mach-O file with both slices (not only the two programs), the updater there,
      # a release build of this build number.
      - name: Check the build as release.py will
        run: python3 -I -B tools/beta/ci_builds.py check-build macos app/build/macos/Build/Products/Release/Fogata.app

      - name: Zip the application
        run: ditto -c -k --keepParent app/build/macos/Build/Products/Release/Fogata.app Fogata-macos-unsigned.zip

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fogata-macos-unsigned
          path: |
            Fogata-macos-unsigned.zip
            toolchain-macos.txt
          if-no-files-found: error
          retention-days: 90

  # No checkout and none of the build's code: it takes the three zips from this run, lists
  # their SHA-256 and has GitHub attest each, for this workflow and this commit.
  attest:
    needs: [linux, windows, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - name: Take the builds of this run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --dir builds \
            --name fogata-linux-x64 --name fogata-windows-x64 --name fogata-macos-unsigned
          mkdir sums
          cd builds
          sha256sum fogata-linux-x64/Fogata-linux-x64-bundle.zip \
            fogata-windows-x64/Fogata-windows-x64.zip \
            fogata-macos-unsigned/Fogata-macos-unsigned.zip |
            sed 's|  [^/]*/|  |' > ../sums/SHA256SUMS
          cat ../sums/SHA256SUMS
          { echo '```'; cat ../sums/SHA256SUMS; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            builds/fogata-linux-x64/Fogata-linux-x64-bundle.zip
            builds/fogata-windows-x64/Fogata-windows-x64.zip
            builds/fogata-macos-unsigned/Fogata-macos-unsigned.zip

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fogata-sha256sums
          path: sums/SHA256SUMS
          if-no-files-found: error
          retention-days: 90
