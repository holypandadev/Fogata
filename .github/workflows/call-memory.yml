# A call of hours on one of GitHub's computers, to see where its memory grows: copies of the
# call test (a profile build, as an installed application is optimised) in the call lab
# (tools/call-lab/measure.sh), every copy's memory by kind of mapping each minute
# (smaps.log), and one copy under heaptrack, which notes every allocation with its call
# stack; tools/call-lab/heap-report.sh then says what was allocated after the call settled
# and never freed. The run folder and the reports are kept as the run's artifact.
#
# Started by hand only (Actions, "Call memory", or `gh workflow run call-memory.yml -f
# seconds=12600`): it builds nothing that is released and checks nothing; a job may last 6
# hours here, which no computer of ours needs to spend.
name: Call memory

on:
  push:
    branches: [call-memory]
  workflow_dispatch:
    inputs:
      seconds:
        description: How long the call is measured, in seconds
        default: "12600"
      mode:
        description: "What the call carries: voice or screen (copy a shares, the others watch)"
        default: voice
      copies:
        description: Copies in the call (2 to 8)
        default: "2"
      heap:
        description: The copy run under heaptrack (a, b, ...; none for no copy)
        default: a
      early:
        description: Seconds after which the call counts as settled, for the growth report
        default: "1800"

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.8
  CARGO_TERM_COLOR: never
  # The copies never read the releases page on GitHub.
  FOGATA_UPDATE_WEB: "off"

jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    env:
      SECONDS_ASKED: ${{ inputs.seconds || '2700' }}
      MODE: ${{ inputs.mode || 'voice' }}
      COPIES: ${{ inputs.copies || '2' }}
      HEAP: ${{ inputs.heap || 'b' }}
      EARLY: ${{ inputs.early || '900' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check what was asked
        run: |
          [[ $SECONDS_ASKED =~ ^[0-9]+$ && $EARLY =~ ^[0-9]+$ && $COPIES =~ ^[2-8]$ ]] ||
            { echo "::error::seconds and early are numbers, copies is 2 to 8"; exit 1; }
          [[ $MODE == voice || $MODE == screen ]] ||
            { echo "::error::mode is voice or screen"; exit 1; }
          [[ $HEAP =~ ^([a-h]|none)$ ]] || { echo "::error::heap is a copy's letter or none"; exit 1; }
          # The build takes about half an hour of the job's six.
          (( SECONDS_ASKED <= 17400 )) || { echo "::error::at most 17400 seconds fit a job"; exit 1; }

      - name: Make room on the disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /usr/share/swift /opt/hostedtoolcache/CodeQL
          df -h /

      # As ci.yml's Linux jobs, and heaptrack with zstd.
      - name: Install the system packages
        timeout-minutes: 20
        run: |
          codename=$(. /etc/os-release && echo "$VERSION_CODENAME")
          curl -fsS --max-time 15 -o /dev/null \
              "http://azure.archive.ubuntu.com/ubuntu/dists/$codename/InRelease" || {
            [[ ! -f /etc/apt/apt-mirrors.txt ]] ||
              sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
          }
          apt="sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          $apt update
          $apt install -y --no-install-recommends \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libasound2-dev libpulse-dev libpipewire-0.3-dev xvfb dbus-x11 pipewire pipewire-pulse \
            wireplumber pulseaudio-utils pipewire-alsa libasound2-plugins heaptrack zstd
          # The lab's sound sessions are unprivileged user namespaces, which Ubuntu's
          # AppArmor refuses by default.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          # Its library and its interpreter come in a package of their own.
          dpkg -L heaptrack libheaptrack | grep -E 'libheaptrack_preload\.so$|heaptrack_interpret$|heaptrack_print$'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install the Rust of rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install

      # Optimised as a release is, but with the names and lines of the Rust core's functions
      # left in, which a release strips: the reports name call stacks by them. In this
      # checkout's Cargo.toml, since the application's build leaves out of cargo's
      # environment whatever would change the release profile (app/rust_builder).
      - name: Build the call test, optimised
        run: |
          sed -i 's/^strip = "symbols"$/strip = false\ndebug = "line-tables-only"/' Cargo.toml
          grep -A4 '^\[profile.release\]' Cargo.toml
          grep -qx 'strip = false' Cargo.toml || { echo "::error::Cargo.toml's release profile is not as expected"; exit 1; }
          cd app
          flutter pub get
          flutter build linux --profile -t integration_test/call_test.dart
          git status --porcelain

      - name: Measure the call
        run: |
          if [[ $HEAP != none ]]; then
            lib=$(dpkg -L heaptrack libheaptrack | grep 'libheaptrack_preload\.so$' | head -n 1)
            interpret=$(dpkg -L heaptrack libheaptrack | grep 'heaptrack_interpret$' | head -n 1)
            [[ -e $lib && -x $interpret ]] || { echo "::error::heaptrack is not installed whole"; exit 1; }
            export MEASURE_HEAP=$HEAP HEAPTRACK_LIB=$lib HEAPTRACK_INTERPRET=$interpret MEASURE_EARLY=$EARLY
          fi
          export CALL_LAB_RUNS=$RUNNER_TEMP/call-lab LOAD_MAX=9
          export BUNDLE=$PWD/app/build/linux/x64/profile/bundle/fogata
          tools/call-lab/measure.sh "$COPIES" "$MODE" "$SECONDS_ASKED" | tee "$RUNNER_TEMP/measure.out" ||
            echo "::warning::measure.sh failed"
          run=$(tail -n 1 "$RUNNER_TEMP/measure.out")
          [[ -d $run ]] || { echo "::error::no run folder"; exit 1; }
          echo "RUN=$run" >> "$GITHUB_ENV"
          # A call that failed measured nothing: the run says so, and still keeps its folder.
          ok=1
          for result in "$run"/meet/?-result.txt; do
            echo "$result: $(head -n 1 "$result" | cut -c1-300)"
            [[ $(head -n 1 "$result") == passed ]] || ok=0
          done
          # The copies' data folders are not part of what was measured.
          rm -rf "$run/data" "$run/session"
          [[ $(ls "$run"/meet/?-result.txt 2> /dev/null | wc -l) == "$COPIES" && $ok == 1 ]] ||
            { echo "::error::not every copy passed"; exit 1; }

      # What was measured, before the reports are made of it: they can take long, and a job
      # that runs out of time keeps nothing it had not put aside yet.
      - name: Keep the run
        if: always() && env.RUN != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: call-memory
          path: ${{ env.RUN }}
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0

      - name: Say what grew
        if: always() && env.RUN != ''
        timeout-minutes: 60
        run: |
          {
            echo "### Call memory: $COPIES copies, $MODE, $SECONDS_ASKED s"
            echo '```'
            cat "$RUN/settings.txt"
            echo "each copy's memory by kind, MB, at the first minute past $EARLY s and at the end:"
            start=$(head -n 1 "$RUN/smaps.log" | cut -d' ' -f1)
            for copy in $(cut -d' ' -f2 "$RUN/smaps.log" | sort -u); do
              awk -v copy="$copy" -v from="$((start + EARLY))" \
                '$2 == copy && $1 >= from { print; exit }' "$RUN/smaps.log" | cut -c1-400
              grep " $copy rss=" "$RUN/smaps.log" | tail -n 1 | cut -c1-400
            done
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          if [[ $HEAP != none ]]; then
            tools/call-lab/heap-report.sh "$RUN" "$HEAP" || echo "::warning::a report failed"
            { echo '```'; head -n 120 "$RUN/heap-$HEAP-growth.txt" | cut -c1-240; echo '```'; } \
              >> "$GITHUB_STEP_SUMMARY" || true
          fi
          mkdir -p "$RUNNER_TEMP/reports"
          cp "$RUN"/heap-*-growth.* "$RUN"/heap-*-held.txt "$RUN"/heap-*-massif.out \
            "$RUN"/heap-*-report.log "$RUN"/smaps.log "$RUN"/settings.txt "$RUNNER_TEMP/reports/" 2> /dev/null || true

      - name: Keep the reports
        if: always() && env.RUN != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: call-memory-reports
          path: ${{ runner.temp }}/reports
          if-no-files-found: warn
          retention-days: 30
