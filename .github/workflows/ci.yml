# The checks of docs/ci.md on GitHub's own computers, one job per system, side by side:
#
#   linux    tools/ci.sh --full: the release build, the native tests, tools/check.sh strict
#            (with the RustSec advisories and the bridge code), the fuzz targets built, the
#            localizations, flutter analyze and test, the integration and pair tests on Xvfb
#            with a PipeWire sound server of the job's own, and the smoke test on the
#            desktops this computer can build (those it cannot are skipped, as on any other
#            computer). Its legs for macOS and Windows are the two jobs below, so ci.sh
#            records them as skipped; the job passes only when everything else in the record
#            passed and was checked.
#   macos    tools/ci-leg.sh macos.
#   windows  tools/ci-leg.ps1, without the smoke test, which needs virtual sound devices.
#
# Nothing here signs, builds a release or touches the releases page: the job's token can only
# read the repository.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.8
  CARGO_TERM_COLOR: never
  # The copies the checks start never read the releases page on GitHub.
  FOGATA_UPDATE_WEB: "off"

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The release build, the debug bundles of the pair tests and the fuzz targets need more
      # disk than the image leaves free.
      - name: Make room on the disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /usr/share/swift /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install the system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libasound2-dev xvfb dbus-x11 pipewire pipewire-pulse wireplumber pulseaudio-utils
          # The sound sessions of tools/call-lab/session.sh are unprivileged user namespaces,
          # which Ubuntu's AppArmor refuses by default.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # The integration and pair tests make their null sinks and virtual microphones on the
      # sound server pactl reaches: one of the job's own, with nothing real behind it.
      - name: Start a sound server
        run: |
          runtime=$RUNNER_TEMP/xdg-runtime
          mkdir -p "$runtime" && chmod 700 "$runtime"
          export XDG_RUNTIME_DIR=$runtime
          bus=unix:path=$runtime/bus
          dbus-daemon --session --fork --address="$bus"
          export DBUS_SESSION_BUS_ADDRESS=$bus
          nohup pipewire > "$RUNNER_TEMP/pipewire.log" 2>&1 &
          sleep 1
          nohup wireplumber > "$RUNNER_TEMP/wireplumber.log" 2>&1 &
          nohup pipewire-pulse > "$RUNNER_TEMP/pipewire-pulse.log" 2>&1 &
          for _ in $(seq 30); do pactl info > /dev/null 2>&1 && break; sleep 1; done
          pactl info
          echo "XDG_RUNTIME_DIR=$runtime" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=$bus" >> "$GITHUB_ENV"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install the Rust tools
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup toolchain install nightly --profile minimal

      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-deny@0.20.2,cargo-fuzz,flutter_rust_bridge_codegen@2.13.0

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            .git/fogata-ci/downloads
          key: linux-deps-${{ hashFiles('Cargo.lock', 'fuzz/Cargo.lock', 'app/third_party/flutter_webrtc/third_party/libwebrtc_version.ini') }}
          restore-keys: linux-deps-

      # ci.sh runs `flutter pub get --offline` and cargo deny offline: the packages and the
      # RustSec database are fetched here first.
      - name: Fetch the Dart packages and the RustSec database
        run: |
          (cd app && flutter pub get)
          cargo deny fetch db
          git status --porcelain

      - name: tools/ci.sh --full
        id: ci
        run: tools/ci.sh --full "$GITHUB_SHA"
        continue-on-error: true

      # ci.sh says `incomplete` here because the macOS and Windows legs are the other jobs:
      # everything else must have run and passed.
      - name: Judge the record
        run: |
          record=.git/fogata-ci/$GITHUB_SHA
          cat "$record"
          ok=1
          for line in 'linux: pass' 'macos: skipped' 'windows: skipped' 'native: pass' \
              'integration: pass' 'codegen: checked' 'notices: checked'; do
            grep -qx "$line" "$record" || { echo "::error::the record does not say '$line'"; ok=0; }
          done
          grep -q '^advisories: checked' "$record" ||
            { echo "::error::the RustSec advisories were not checked"; ok=0; }
          grep -Eq '^pairs: pass( |$)' "$record" ||
            { echo "::error::the pair tests did not pass"; ok=0; }
          grep -Eq '^smoke: (pass|skipped)' "$record" ||
            { echo "::error::the smoke test failed"; ok=0; }
          grep -qx 'result: fail' "$record" && { echo "::error::ci.sh says fail"; ok=0; }
          [[ $ok == 1 ]]

      - name: Keep the log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-linux
          path: |
            .git/fogata-ci/${{ github.sha }}
            .git/fogata-ci/${{ github.sha }}.log
          if-no-files-found: ignore
          retention-days: 14

  macos:
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-deny@0.20.2

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: macos-deps-${{ hashFiles('Cargo.lock') }}
          restore-keys: macos-deps-

      - name: Fetch the Dart packages
        run: |
          (cd app && flutter pub get)
          git status --porcelain

      - name: tools/ci-leg.sh macos
        run: FOGATA_CI_SHA=$GITHUB_SHA tools/ci-leg.sh macos

  windows:
    runs-on: windows-2025
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-deny@0.20.2

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: windows-deps-${{ hashFiles('Cargo.lock') }}
          restore-keys: windows-deps-

      - name: Fetch the Dart packages
        shell: pwsh
        run: |
          Push-Location app
          flutter pub get
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
          git status --porcelain

      - name: tools/ci-leg.ps1
        shell: pwsh
        env:
          FOGATA_CI_LEG_SKIP: smoke
        run: |
          $env:FOGATA_CI_SHA = $env:GITHUB_SHA
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\ci-leg.ps1
          exit $LASTEXITCODE
