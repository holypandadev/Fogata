# The checks of docs/ci.md on GitHub's own computers, side by side:
#
#   linux         tools/ci.sh --full --split app: the release build, the native tests, the
#                 localizations, flutter analyze and test, the integration and pair tests on
#                 Xvfb with a PipeWire sound server of the job's own, and the smoke test on
#                 the desktops this computer can build: x11 (Xvfb) must run and pass; the KDE
#                 ones (wayland, xwayland, bare) need a GPU render node GitHub's computers
#                 lack and are skipped, as on any other computer without one.
#   linux-checks  tools/ci.sh --full --split checks: tools/check.sh strict (formatting,
#                 clippy, every test, cargo deny with the RustSec advisories, the release
#                 scripts' tests, THIRD-PARTY-NOTICES, the bridge code) and the fuzz targets
#                 built.
#                 The two are the halves of one tools/ci.sh --full run, on two computers so
#                 that neither waits for the other: between them they run every step of
#                 ci.sh, each in a clean worktree of the commit, each from the same system
#                 packages and the same setup. Each judges its own record: every step of its
#                 half ran and passed. The legs for macOS and Windows are the two jobs below,
#                 so ci.sh records them as skipped.
#   macos         with the Xcode of XCODE_VERSION and the CocoaPods of Podfile.lock:
#                 tools/ci-leg.sh macos, then the release build of the application, universal
#                 (the native plugins, the macOS WebRTC.xcframework, the Rust library for
#                 both Macs) with its updater helper, checked as tools/beta/release.py checks
#                 it.
#   windows       tools/ci-leg.ps1, without the smoke test, which needs virtual sound
#                 devices, then the release build of the application (the native plugins
#                 with the release-only mitigations, the Windows libwebrtc, which flutter
#                 test never compiles), checked as tools/beta/release.py checks it.
#
# The run passes only when every job passed: tools/beta/release.py asks GitHub for the run's
# own conclusion, whatever the jobs are. The Linux bundle is checked as release.py checks it
# too, in ci.sh (tools/beta/ci_builds.py check-build): a build release.py would refuse fails
# here, at the push, not at the release. Each job writes what it built with
# (tools/toolchain.sh) to the run's summary.
#
# Nothing here signs, builds a release or touches the releases page: the job's token can only
# read the repository.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request replaces the run of the one before; on main every commit
# keeps its own run (a group of its own: in a shared group a third push would still drop the
# second's waiting run), so a quick second push never leaves the first without a result.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FLUTTER_VERSION: 3.47.8
  # The Xcode of the macOS builds, among those GitHub's image has: the image's default
  # changes with it. The same in release-build.yml.
  XCODE_VERSION: "16.4"
  CARGO_TERM_COLOR: never
  # The copies the checks start never read the releases page on GitHub.
  FOGATA_UPDATE_WEB: "off"
  # The nightly the fuzz targets are built with (tools/ci.sh, tools/fuzz.sh): a dated one, so
  # a new nightly cannot break the run overnight. Moved forward by hand, like the stable Rust.
  FOGATA_FUZZ_TOOLCHAIN: nightly-2026-11-10
  CARGO_FUZZ_VERSION: 0.13.2

jobs:
  # The half of tools/ci.sh that builds and runs the application. Its setup is the same as
  # linux-checks' (but the fuzz toolchain, which only that half uses): change both together.
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The release build and the debug bundles of the pair tests need more disk than the
      # image leaves free.
      - name: Make room on the disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /usr/share/swift /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install the system packages
        timeout-minutes: 20
        run: |
          # GitHub's image tries Azure's mirror of Ubuntu first. When it does not answer
          # (its name not resolving, or resolving to nothing that answers), apt neither
          # gives up nor goes on to the next mirror in good time: one job sat here for two
          # hours. So the mirror is asked first and left out when it gives nothing within
          # 15 s, and apt itself waits at most 30 s for anything.
          codename=$(. /etc/os-release && echo "$VERSION_CODENAME")
          curl -fsS --max-time 15 -o /dev/null \
              "http://azure.archive.ubuntu.com/ubuntu/dists/$codename/InRelease" || {
            [[ ! -f /etc/apt/apt-mirrors.txt ]] ||
              sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
          }
          apt="sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          $apt update
          $apt install -y --no-install-recommends \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libasound2-dev libpulse-dev libpipewire-0.3-dev xvfb dbus-x11 pipewire pipewire-pulse \
            wireplumber pulseaudio-utils pipewire-alsa libasound2-plugins \
            gstreamer1.0-tools gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-libav
          # GStreamer is what the Linux video player opens at run time (video_test); the ALSA
          # plugins lead a voice message's recording to the sound server (voice_test).
          # The sound sessions of tools/call-lab/session.sh are unprivileged user namespaces,
          # which Ubuntu's AppArmor refuses by default.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # The integration and pair tests make their null sinks and virtual microphones on the
      # sound server pactl reaches: one of the job's own, with nothing real behind it.
      - name: Start a sound server
        run: |
          runtime=$RUNNER_TEMP/xdg-runtime
          mkdir -p "$runtime" && chmod 700 "$runtime"
          export XDG_RUNTIME_DIR=$runtime
          bus=unix:path=$runtime/bus
          dbus-daemon --session --fork --address="$bus"
          export DBUS_SESSION_BUS_ADDRESS=$bus
          nohup pipewire > "$RUNNER_TEMP/pipewire.log" 2>&1 &
          sleep 1
          nohup wireplumber > "$RUNNER_TEMP/wireplumber.log" 2>&1 &
          nohup pipewire-pulse > "$RUNNER_TEMP/pipewire-pulse.log" 2>&1 &
          for _ in $(seq 30); do pactl info > /dev/null 2>&1 && break; sleep 1; done
          pactl info
          echo "XDG_RUNTIME_DIR=$runtime" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=$bus" >> "$GITHUB_ENV"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install the Rust of rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install

      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-deny@0.20.2,flutter_rust_bridge_codegen@2.13.0

      # The crates, and the builds of the dependencies (never of the workspace's own crates,
      # which rust-cache leaves out) in the target folder ci.sh keeps, a cache of this job's
      # own. Saved only by a push to main: a pull request reads it and never writes it, so
      # what a pull request's code builds never reaches another run. (Cargo checks every
      # crate's source against Cargo.lock, but not the builds it finds in the target folder:
      # what keeps those honest is that only main writes them.)
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: . -> .git/fogata-ci/target
          cache-bin: "false"
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      # The libwebrtc archive, checked by its SHA-256 when it is unpacked.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .git/fogata-ci/downloads
          key: linux-webrtc-${{ hashFiles('app/third_party/flutter_webrtc/third_party/libwebrtc_version.ini') }}

      # ci.sh runs `flutter pub get --offline`: the packages and the crates are fetched here
      # first.
      - name: Fetch the Dart packages and the crates
        run: |
          (cd app && flutter pub get)
          cargo fetch
          git status --porcelain

      - name: Record the toolchain
        run: |
          { echo '### Toolchain (linux)'; echo '```'; tools/toolchain.sh linux; echo '```'; } |
            tee -a "$GITHUB_STEP_SUMMARY"

      - name: tools/ci.sh --full --split app
        id: ci
        run: tools/ci.sh --full --split app "$GITHUB_SHA"
        continue-on-error: true

      # ci.sh says `incomplete` here, since half its steps are linux-checks' and the macOS and
      # Windows legs are the other jobs: every step of this half must have run and passed.
      - name: Judge the record
        run: |
          record=.git/fogata-ci/$GITHUB_SHA
          cat "$record"
          ok=1
          for line in 'split: app' 'linux: pass' 'macos: skipped' 'windows: skipped' \
              'native: pass' 'integration: pass'; do
            grep -qx "$line" "$record" || { echo "::error::the record does not say '$line'"; ok=0; }
          done
          grep -Eq '^pairs: pass( |$)' "$record" ||
            { echo "::error::the pair tests did not pass"; ok=0; }
          # At least one desktop must have run the smoke test and passed (x11, on Xvfb, can be
          # built here); the KDE desktops (wayland, xwayland, bare) need a GPU render node and
          # may be skipped. `pass` means some desktop passed and none failed.
          grep -Eq '^smoke: pass \((wayland|xwayland|bare|x11)[ ;]' "$record" ||
            { echo "::error::no smoke desktop ran and passed"; ok=0; }
          grep -qx 'result: fail' "$record" && { echo "::error::ci.sh says fail"; ok=0; }
          [[ $ok == 1 ]]

      - name: Keep the log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-linux
          path: |
            .git/fogata-ci/${{ github.sha }}
            .git/fogata-ci/${{ github.sha }}.log
          if-no-files-found: ignore
          retention-days: 14

  # The other half of tools/ci.sh: tools/check.sh and the fuzz targets' build. The same setup
  # as the linux job's (system packages, sound server, Flutter, Rust, cargo-deny, the bridge
  # generator), so that every test check.sh runs finds what it found when one job ran both
  # halves; and the fuzz toolchain.
  linux-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The tests' builds and the fuzz targets need more disk than the image leaves free.
      - name: Make room on the disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /usr/share/swift /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install the system packages
        timeout-minutes: 20
        run: |
          # As in the linux job: Azure's mirror left out when it does not answer.
          codename=$(. /etc/os-release && echo "$VERSION_CODENAME")
          curl -fsS --max-time 15 -o /dev/null \
              "http://azure.archive.ubuntu.com/ubuntu/dists/$codename/InRelease" || {
            [[ ! -f /etc/apt/apt-mirrors.txt ]] ||
              sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
          }
          apt="sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          $apt update
          $apt install -y --no-install-recommends \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libasound2-dev libpulse-dev libpipewire-0.3-dev xvfb dbus-x11 pipewire pipewire-pulse \
            wireplumber pulseaudio-utils pipewire-alsa libasound2-plugins \
            gstreamer1.0-tools gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-libav
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # As in the linux job: the Rust tests run beside a sound server of the job's own, as
      # they did when one job ran everything.
      - name: Start a sound server
        run: |
          runtime=$RUNNER_TEMP/xdg-runtime
          mkdir -p "$runtime" && chmod 700 "$runtime"
          export XDG_RUNTIME_DIR=$runtime
          bus=unix:path=$runtime/bus
          dbus-daemon --session --fork --address="$bus"
          export DBUS_SESSION_BUS_ADDRESS=$bus
          nohup pipewire > "$RUNNER_TEMP/pipewire.log" 2>&1 &
          sleep 1
          nohup wireplumber > "$RUNNER_TEMP/wireplumber.log" 2>&1 &
          nohup pipewire-pulse > "$RUNNER_TEMP/pipewire-pulse.log" 2>&1 &
          for _ in $(seq 30); do pactl info > /dev/null 2>&1 && break; sleep 1; done
          pactl info
          echo "XDG_RUNTIME_DIR=$runtime" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=$bus" >> "$GITHUB_ENV"

      # The bridge generator (check.sh) and `flutter pub get` need Flutter.
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install the Rust tools
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup toolchain install "$FOGATA_FUZZ_TOOLCHAIN" --profile minimal

      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-deny@0.20.2,flutter_rust_bridge_codegen@2.13.0

      # Built here: the published binary of cargo-fuzz is built for musl and builds the fuzz
      # targets for musl, where the sanitizers do not work. Built once per version and kept in
      # a folder of its own (saved only by a push to main, like the builds of the crates).
      - name: Restore cargo-fuzz
        id: cargo-fuzz
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/fogata-cargo-fuzz
          key: cargo-fuzz-${{ env.CARGO_FUZZ_VERSION }}-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}
      - name: Install cargo-fuzz
        run: |
          root=$HOME/.cache/fogata-cargo-fuzz
          if [[ ! -x $root/bin/cargo-fuzz ]]; then
              cargo install cargo-fuzz --version "$CARGO_FUZZ_VERSION" --locked --root "$root"
          fi
          echo "$root/bin" >> "$GITHUB_PATH"
          PATH=$root/bin:$PATH cargo fuzz --version
      - name: Keep cargo-fuzz
        if: steps.cargo-fuzz.outputs.cache-hit != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/fogata-cargo-fuzz
          key: ${{ steps.cargo-fuzz.outputs.cache-primary-key }}

      # As in the linux job (see there), a cache of this job's own: rust-cache names each
      # job's cache apart.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: . -> .git/fogata-ci/target
          cache-bin: "false"
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      # ci.sh runs `flutter pub get --offline` and cargo deny offline (over the crates of every
      # system): the packages, the crates and the RustSec database are fetched here first.
      - name: Fetch the Dart packages and the RustSec database
        run: |
          (cd app && flutter pub get)
          cargo fetch
          cargo fetch --manifest-path fuzz/Cargo.toml
          cargo deny fetch db
          git status --porcelain

      - name: Record the toolchain
        run: |
          { echo '### Toolchain (linux-checks)'; echo '```'; tools/toolchain.sh linux; echo '```'; } |
            tee -a "$GITHUB_STEP_SUMMARY"

      - name: tools/ci.sh --full --split checks
        id: ci
        run: tools/ci.sh --full --split checks "$GITHUB_SHA"
        continue-on-error: true

      # ci.sh says `incomplete` here, since half its steps are the linux job's: every step of
      # this half must have run and passed, nothing of check.sh left out.
      - name: Judge the record
        run: |
          record=.git/fogata-ci/$GITHUB_SHA
          cat "$record"
          ok=1
          for line in 'split: checks' 'linux: pass' 'codegen: checked' 'notices: checked'; do
            grep -qx "$line" "$record" || { echo "::error::the record does not say '$line'"; ok=0; }
          done
          grep -q '^advisories: checked' "$record" ||
            { echo "::error::the RustSec advisories were not checked"; ok=0; }
          grep -qx 'result: fail' "$record" && { echo "::error::ci.sh says fail"; ok=0; }
          [[ $ok == 1 ]]

      - name: Keep the log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-linux-checks
          path: |
            .git/fogata-ci/${{ github.sha }}
            .git/fogata-ci/${{ github.sha }}.log
          if-no-files-found: ignore
          retention-days: 14

  macos:
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # DEVELOPER_DIR, which xcode-select, xcodebuild, xcrun and Flutter follow, for every
      # step after this one (no sudo, nothing changed outside the job).
      - name: Use the Xcode of XCODE_VERSION
        run: |
          xcode=/Applications/Xcode_$XCODE_VERSION.app
          [[ -d $xcode ]] || {
            echo "::error::no $xcode on this image; it has: $(ls -d /Applications/Xcode_*.app | xargs -n1 basename | tr '\n' ' ')"
            exit 1
          }
          echo "DEVELOPER_DIR=$xcode/Contents/Developer" >> "$GITHUB_ENV"

      # The CocoaPods that wrote Podfile.lock, not the image's: it writes the Pods project the
      # build is made from. Installed for this user, beside the image's, and run as that
      # version alone (a gem's `pod _<version>_`).
      - name: Use the CocoaPods of Podfile.lock
        run: |
          version=$(sed -n 's/^COCOAPODS: \([0-9.]*\)$/\1/p' app/macos/Podfile.lock)
          [[ -n $version ]] || { echo "::error::Podfile.lock names no CocoaPods version"; exit 1; }
          gem install --user-install --no-document cocoapods -v "$version"
          bin=$RUNNER_TEMP/cocoapods-bin
          mkdir -p "$bin"
          printf '#!/bin/sh\nexec "%s/bin/pod" _%s_ "$@"\n' "$(ruby -e 'print Gem.user_dir')" "$version" > "$bin/pod"
          chmod +x "$bin/pod"
          [[ $("$bin/pod" --version) == "$version" ]] || { echo "::error::pod is not $version"; exit 1; }
          echo "$bin" >> "$GITHUB_PATH"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          # Not kept: the SDK caches of the three systems took most of the repository's 10 GB
          # of caches, which the builds of the dependencies need; only Linux keeps its own.
          cache: false

      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-deny@0.20.2

      # The release build is universal: the Rust library is built for both Mac targets.
      - name: Install the Rust of rust-toolchain.toml
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      # The crates and the builds of the dependencies, saved only by a push to main (see the
      # Linux job).
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-bin: "false"
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      # cargo deny runs offline over the crates of every system, not only this one's.
      - name: Fetch the Dart packages and the crates
        run: |
          (cd app && flutter pub get)
          cargo fetch
          git status --porcelain

      # These computers carry no multicast: the mDNS test (crates/fogata-net/tests/mdns_stale.rs)
      # finds nothing there, and runs on the Linux job and on the computers of tools/ci.sh.
      - name: tools/ci-leg.sh macos
        env:
          FOGATA_TEST_NO_MULTICAST: "1"
        run: FOGATA_CI_SHA=$GITHUB_SHA tools/ci-leg.sh macos

      # The application itself, which flutter test never compiles, as release-build.yml
      # builds it: release, universal (both slices of every native part, the Rust library's
      # through cargokit and the objective_c hook's too), the macOS WebRTC.xcframework
      # downloaded from the releases of fogata-libwebrtc and checked by its SHA-256
      # (app/macos/WebRTC-SDK.podspec), and the updater helper (with no team pinned: the
      # release pins one). Signed ad hoc, to run here only. Instead of the debug build CI made
      # before, not beside it.
      - name: Build the application (release)
        run: |
          (cd app && flutter build macos --release)
          tools/beta/macos-updater.sh

      - name: Record the toolchain
        if: always()
        run: |
          { echo '### Toolchain (macos)'; echo '```'; tools/toolchain.sh macos; echo '```'; } |
            tee -a "$GITHUB_STEP_SUMMARY"

      # What release.py checks before it packs the app: a release build, universal, its
      # Info.plist naming this build. Podfile.lock is shown if CocoaPods wrote it again.
      - name: Check the build as release.py will
        run: |
          git diff -- app/macos/Podfile.lock
          python3 -I -B tools/beta/ci_builds.py check-build macos app/build/macos/Build/Products/Release/Fogata.app

  windows:
    runs-on: windows-2025
    timeout-minutes: 200
    steps:
      # The image converts line endings on checkout; flutter pub get then writes the generated
      # plugin files again with the repository's, and ci-leg.ps1 sees a changed clone.
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          # Not kept: the SDK caches of the three systems took most of the repository's 10 GB
          # of caches, which the builds of the dependencies need; only Linux keeps its own.
          cache: false

      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-deny@0.20.2

      - name: Install the Rust of rust-toolchain.toml
        shell: pwsh
        run: |
          rustup show active-toolchain
          if ($LASTEXITCODE -ne 0) { rustup toolchain install }
          exit $LASTEXITCODE

      # The crates and the builds of the dependencies, saved only by a push to main (see the
      # Linux job).
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-bin: "false"
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      # The libwebrtc archive the application's build downloads, checked by its SHA-256.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: app/third_party/flutter_webrtc/third_party/downloads
          key: windows-webrtc-${{ hashFiles('app/third_party/flutter_webrtc/third_party/libwebrtc_version.ini') }}

      # cargo deny runs offline over the crates of every system, not only this one's.
      - name: Fetch the Dart packages and the crates
        shell: pwsh
        run: |
          Push-Location app
          flutter pub get
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
          cargo fetch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git status --porcelain

      # Without the smoke test, which needs virtual sound devices.
      - name: tools/ci-leg.ps1
        shell: pwsh
        env:
          FOGATA_CI_LEG_SKIP: smoke
        run: |
          $env:FOGATA_CI_SHA = $env:GITHUB_SHA
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\ci-leg.ps1
          exit $LASTEXITCODE

      # The application itself, which flutter test never compiles, as release-build.yml
      # builds it: release, so the native plugins (CMake and MSVC) get the mitigations only a
      # release build has (Control Flow Guard, EH continuation metadata:
      # app/windows/CMakeLists.txt), with the Rust library through cargokit and the Windows
      # libwebrtc, downloaded from the release libwebrtc_version.ini names and refused unless
      # its SHA-256 matches. Instead of the debug build CI made before, not beside it. After
      # the leg, which needs a clone with nothing new in it.
      - name: Build the application (release)
        shell: pwsh
        working-directory: app
        run: |
          flutter build windows --release
          exit $LASTEXITCODE

      - name: Record the toolchain
        if: always()
        shell: bash
        run: |
          { echo '### Toolchain (windows)'; echo '```'; tools/toolchain.sh windows app/build/windows/x64; echo '```'; } |
            tee -a "$GITHUB_STEP_SUMMARY"

      # What release.py checks before it packs the application: a release build, every .exe
      # and .dll with its mitigations.
      - name: Check the build as release.py will
        shell: bash
        run: python -I -B tools/beta/ci_builds.py check-build windows app/build/windows/x64/runner/Release
