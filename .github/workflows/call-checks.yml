# The Linux calls checked before a release (docs/releasing-beta.md, "Checks before a
# release", 2) on one of GitHub's computers, started by hand on the commit to be released:
#
#   gh workflow run call-checks.yml --ref <branch or tag>
#
# On a clean checkout it makes a release build of the application and checks it as
# tools/beta/release.py does, runs the video plugin's native tests, builds the call test
# twice (profile and debug), and then, in the call lab (tools/call-lab), the microphone
# checks (late once more with PipeWire's quantum left free), rejoining on the profile
# build, a shared screen's sound beside a loopback and a combined output, and calls of 4
# and 6 copies with a camera and a shared screen. Each part is a step of its own and says
# pass or fail; the last step writes them all to the run's
# summary with the tables of tools/call-lab/sum.py, looks for a crash of the application
# since the lab started (systemd-coredump, the kernel log, a core file), and fails the run if
# anything failed or did not run. The run folders and their logs, without the copies' data
# folders, are the run's artifact.
#
# One job: every part needs the same builds, and the parts run one after another anyway
# (each takes the computer's sound sessions and processors to itself); a run that passes
# takes about 40 minutes of the six hours a job may last, one whose calls wait for copies
# that never answer up to two hours. Nothing here signs or publishes anything, and the
# job's token can only read the repository.
name: Call checks

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.8
  CARGO_TERM_COLOR: never
  # The copies never read the releases page on GitHub.
  FOGATA_UPDATE_WEB: "off"

defaults:
  run:
    shell: bash

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    env:
      # The computer's load the lab waits under before a call, and its own X display.
      LOAD_MAX: "9"
      LAB_DISPLAY: "172"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Where the lab writes its run folders, and one line a part:
      # <part>|<pass, fail or ran>|<what it found, or a call's run folder>.
      - name: Make the lab's folder
        run: |
          mkdir -p "$RUNNER_TEMP/call-lab"
          : > "$RUNNER_TEMP/parts.txt"
          echo "CALL_LAB_RUNS=$RUNNER_TEMP/call-lab" >> "$GITHUB_ENV"
          echo "PARTS=$RUNNER_TEMP/parts.txt" >> "$GITHUB_ENV"

      - name: Make room on the disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /usr/share/swift /opt/hostedtoolcache/CodeQL
          df -h /

      # As ci.yml's Linux jobs, and systemd-coredump, which notes every crash.
      - name: Install the system packages
        timeout-minutes: 20
        run: |
          codename=$(. /etc/os-release && echo "$VERSION_CODENAME")
          curl -fsS --max-time 15 -o /dev/null \
              "http://azure.archive.ubuntu.com/ubuntu/dists/$codename/InRelease" || {
            [[ ! -f /etc/apt/apt-mirrors.txt ]] ||
              sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
          }
          apt="sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          $apt update
          $apt install -y --no-install-recommends \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libasound2-dev libpulse-dev libpipewire-0.3-dev xvfb x11-utils dbus-x11 pipewire \
            pipewire-pulse wireplumber pulseaudio-utils pipewire-alsa libasound2-plugins \
            systemd-coredump ffmpeg
          # The lab's sound sessions are unprivileged user namespaces, which Ubuntu's
          # AppArmor refuses by default.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          echo "core_pattern: $(cat /proc/sys/kernel/core_pattern)"
          grep -q systemd-coredump /proc/sys/kernel/core_pattern ||
            { echo "::error::crashes would not reach systemd-coredump"; exit 1; }

      # Before half an hour of builds: in a sound session of the lab's (session.sh), a
      # recording from a virtual microphone must be linked to it, as every check needs.
      - name: Try the lab's sound session
        timeout-minutes: 5
        run: |
          check=$RUNNER_TEMP/session-check
          # shellcheck disable=SC2016
          tools/call-lab/session.sh "$check" bash -c '
            pactl load-module module-null-sink sink_name=try sink_properties=device.description=Try > /dev/null
            pactl load-module module-remap-source source_name=try_mic master=try.monitor > /dev/null
            parecord --device=try_mic /dev/null &
            sleep 3
            pactl list short source-outputs
            python3 -I tools/call-lab/recording.py | tee "$CALL_LAB_SESSION/recording.txt"
            kill $!' || echo "::error::the session did not start"
          for log in "$check"/*.log; do echo "--- $log"; tail -n 40 "$log"; done
          grep -q ':try_mic' "$check/recording.txt" ||
            { echo "::error::a recording in the lab's sound session reaches no microphone"; exit 1; }

      # The video plugin's native tests list the sound devices of the sound server pactl
      # reaches: one of the job's own, as in ci.yml. The lab's sessions hide it.
      - name: Start a sound server
        run: |
          runtime=$RUNNER_TEMP/xdg-runtime
          mkdir -p "$runtime" && chmod 700 "$runtime"
          export XDG_RUNTIME_DIR=$runtime
          bus=unix:path=$runtime/bus
          dbus-daemon --session --fork --address="$bus"
          export DBUS_SESSION_BUS_ADDRESS=$bus
          nohup pipewire > "$RUNNER_TEMP/pipewire.log" 2>&1 &
          sleep 1
          nohup wireplumber > "$RUNNER_TEMP/wireplumber.log" 2>&1 &
          nohup pipewire-pulse > "$RUNNER_TEMP/pipewire-pulse.log" 2>&1 &
          for _ in $(seq 30); do pactl info > /dev/null 2>&1 && break; sleep 1; done
          pactl info
          echo "XDG_RUNTIME_DIR=$runtime" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=$bus" >> "$GITHUB_ENV"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install the Rust of rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install

      # The libwebrtc archive, checked by its SHA-256 when it is unpacked.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: app/third_party/flutter_webrtc/third_party/downloads
          key: linux-webrtc-${{ hashFiles('app/third_party/flutter_webrtc/third_party/libwebrtc_version.ini') }}

      - name: Release build
        id: release
        timeout-minutes: 60
        run: |
          cd app
          flutter pub get
          if flutter build linux --release; then
            echo "release build|pass|" >> "$PARTS"
          else
            echo "release build|fail|" >> "$PARTS"
            exit 1
          fi

      - name: Release checks of the bundle
        if: ${{ !cancelled() && steps.release.outcome == 'success' }}
        run: |
          if python3 -I -B tools/beta/ci_builds.py check-build linux app/build/linux/x64/release/bundle; then
            echo "release checks of the bundle|pass|" >> "$PARTS"
          else
            echo "release checks of the bundle|fail|" >> "$PARTS"
            exit 1
          fi

      - name: Native tests of the video plugin
        if: ${{ !cancelled() && steps.release.outcome == 'success' }}
        timeout-minutes: 40
        run: |
          if bash app/third_party/flutter_webrtc/common/cpp/test/run_tests.sh; then
            echo "native tests|pass|" >> "$PARTS"
          else
            echo "native tests|fail|" >> "$PARTS"
            exit 1
          fi

      # Put aside: the debug build after it rewrites what the builds share.
      - name: Profile build of the call test
        id: profile
        if: ${{ !cancelled() }}
        timeout-minutes: 60
        run: |
          cd app
          if flutter build linux --profile -t integration_test/call_test.dart; then
            cp -a build/linux/x64/profile/bundle "$RUNNER_TEMP/profile-bundle"
            echo "PROFILE=$RUNNER_TEMP/profile-bundle/fogata" >> "$GITHUB_ENV"
            echo "profile build of the call test|pass|" >> "$PARTS"
          else
            echo "profile build of the call test|fail|" >> "$PARTS"
            exit 1
          fi

      - name: Debug build of the call test
        id: debug
        if: ${{ !cancelled() }}
        timeout-minutes: 60
        run: |
          cd app
          if flutter build linux --debug -t integration_test/call_test.dart; then
            echo "debug build of the call test|pass|" >> "$PARTS"
          else
            echo "debug build of the call test|fail|" >> "$PARTS"
            exit 1
          fi
          # Crashes are looked for from here on.
          echo "LAB_START=$(date +%s)" >> "$GITHUB_ENV"

      # On the debug build (media needs its made-up camera). Each check says PASS or FAIL
      # and why (tools/call-lab/mic_check.py).
      - name: Microphone checks
        if: ${{ !cancelled() && steps.debug.outcome == 'success' }}
        timeout-minutes: 120
        run: |
          failed=0
          for check in media devices alone late muted unplug switch broken hang noise; do
            echo "::group::mic.sh $check"
            if tools/call-lab/mic.sh "$check" | tee "$RUNNER_TEMP/mic.out"; then
              echo "mic $check|pass|" >> "$PARTS"
            else
              why=$(grep -m 1 '^  problem: ' "$RUNNER_TEMP/mic.out" | sed 's/^  problem: //; s/|/:/g' | cut -c1-200 || true)
              echo "mic $check|fail|$why" >> "$PARTS"
              echo "::error::mic.sh $check failed"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit $failed

      # A microphone turned on again while the other side holds a tone, with a headset and
      # with speakers (tools/call-lab/mic.sh unmute:headset, unmute:speakers; the room's
      # sound is made with ffmpeg): what the other side hears of it must be as later in
      # the call, and its tone must not go back to it, and no echo controller may be made
      # meanwhile but one made anew on purpose (tools/call-lab/unmute_check.py).
      - name: Turning the microphone on again while the other side talks
        if: ${{ !cancelled() && steps.debug.outcome == 'success' }}
        timeout-minutes: 20
        run: |
          failed=0
          for check in unmute:headset unmute:speakers; do
            echo "::group::mic.sh $check"
            if tools/call-lab/mic.sh "$check" | tee "$RUNNER_TEMP/mic.out"; then
              echo "mic $check|pass|" >> "$PARTS"
            else
              why=$(grep -m 1 '^  problem: ' "$RUNNER_TEMP/mic.out" | sed 's/^  problem: //; s/|/:/g' | cut -c1-200 || true)
              echo "mic $check|fail|$why" >> "$PARTS"
              echo "::error::mic.sh $check failed"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit $failed

      # mic.sh late again with PipeWire's quantum left free, as on a person's computer
      # (tools/call-lab/lab.sh, LAB_FIXED_QUANTUM): a recording started again as the
      # microphone opens gives only silence from the lab's remapped microphone there, so
      # this fails if the application does that again.
      - name: The microphone opening late, the quantum free
        if: ${{ !cancelled() && steps.debug.outcome == 'success' }}
        timeout-minutes: 15
        run: |
          if LAB_FIXED_QUANTUM=0 tools/call-lab/mic.sh late | tee "$RUNNER_TEMP/mic.out"; then
            echo "mic late (quantum free)|pass|" >> "$PARTS"
          else
            why=$(grep -m 1 '^  problem: ' "$RUNNER_TEMP/mic.out" | sed 's/^  problem: //; s/|/:/g' | cut -c1-200 || true)
            echo "mic late (quantum free)|fail|$why" >> "$PARTS"
            exit 1
          fi

      - name: Rejoining, on the profile build
        if: ${{ !cancelled() && steps.profile.outcome == 'success' }}
        timeout-minutes: 30
        run: |
          if BUNDLE=$PROFILE tools/call-lab/mic.sh rejoin | tee "$RUNNER_TEMP/mic.out"; then
            echo "mic rejoin (profile)|pass|" >> "$PARTS"
          else
            why=$(grep -m 1 '^  problem: ' "$RUNNER_TEMP/mic.out" | sed 's/^  problem: //; s/|/:/g' | cut -c1-200 || true)
            echo "mic rejoin (profile)|fail|$why" >> "$PARTS"
            exit 1
          fi

      # A loopback of what a plays and a combined output, as on a desktop with such a
      # setup, while a shares its screen taking every application's sound: a must pass both
      # on, not link them (tools/call-lab/lab.sh, lab_devices).
      - name: A shared screen's sound beside a loopback
        if: ${{ !cancelled() && steps.debug.outcome == 'success' }}
        timeout-minutes: 30
        run: |
          CALL_LAB_LOOPBACK=1 MEASURE_ENV="FOGATA_SCREEN_SOUND_FROM=" \
            tools/call-lab/measure.sh 2 screen 30 | tee "$RUNNER_TEMP/measure.out" || true
          run=$(tail -n 1 "$RUNNER_TEMP/measure.out")
          [[ -d $run ]] || { echo "screen sound with a loopback|fail|no run folder" >> "$PARTS"; exit 1; }
          echo "$run" > "$RUNNER_TEMP/loopback-run"
          passed=$(grep -c 'passed on, not linked' "$run/a.out" || true)
          linked=$(grep -c '\[ScreenSound\] linking node' "$run/a.out" || true)
          echo "'passed on, not linked': $passed; '[ScreenSound] linking node':"
          grep '\[ScreenSound\] linking node' "$run/a.out" | cut -c1-300 || true
          if (( passed > 0 )) && ! grep -q '\[ScreenSound\] linking node .*binary=pipewire-pulse' "$run/a.out"; then
            echo "screen sound with a loopback|pass|$passed passed on, $linked linked" >> "$PARTS"
          else
            echo "screen sound with a loopback|fail|$passed passed on, $linked linked" >> "$PARTS"
            exit 1
          fi

      - name: Calls on the debug build
        if: ${{ !cancelled() && steps.debug.outcome == 'success' }}
        timeout-minutes: 60
        run: |
          for call in "4 camera 60" "4 screen 60"; do
            echo "::group::measure.sh $call"
            # shellcheck disable=SC2086
            tools/call-lab/measure.sh $call | tee "$RUNNER_TEMP/measure.out" || true
            echo "::endgroup::"
            echo "call $call (debug)|ran|$(tail -n 1 "$RUNNER_TEMP/measure.out")" >> "$PARTS"
          done

      - name: Calls on the profile build
        if: ${{ !cancelled() && steps.profile.outcome == 'success' }}
        timeout-minutes: 90
        run: |
          for copies in 4 4 4 6 6; do
            echo "::group::measure.sh $copies screen 90"
            BUNDLE=$PROFILE tools/call-lab/measure.sh "$copies" screen 90 | tee "$RUNNER_TEMP/measure.out" || true
            echo "::endgroup::"
            echo "call $copies screen 90 (profile)|ran|$(tail -n 1 "$RUNNER_TEMP/measure.out")" >> "$PARTS"
          done

      # Every run folder: no copy kept out, none failed, a result from every copy; no crash
      # of the application since the lab started; and the tables of sum.py.
      - name: Judge and sum up
        if: always() && env.CALL_LAB_RUNS != ''
        timeout-minutes: 15
        run: |
          set +e +o pipefail
          failed=0
          results=()
          # The calls are judged below by their run folders; one that made none fails here.
          while IFS='|' read -r part result note; do
            if [[ $result == ran ]]; then
              [[ -d $note ]] || results+=("$part|fail|no run folder")
            else
              results+=("$part|$result|$note")
            fi
          done < "${PARTS:-/dev/null}"
          for run in "$CALL_LAB_RUNS"/*/; do
            [[ -d $run ]] || continue
            run=${run%/}
            name=$(basename "$run")
            copies=2
            [[ $name =~ ^measure-([0-9])- ]] && copies=${BASH_REMATCH[1]}
            problems=()
            kept=$(grep -il 'kept out' "$run"/*.out 2> /dev/null | xargs -r -n 1 basename | tr '\n' ' ')
            [[ -z $kept ]] || problems+=("kept out in $kept")
            bad=$(grep -l '^failed' "$run"/meet/?-result.txt 2> /dev/null | xargs -r -n 1 basename | tr '\n' ' ')
            [[ -z $bad ]] || problems+=("failed: $bad($(head -q -n 1 "$run"/meet/?-result.txt | grep '^failed' | head -n 1 | tr '|' ':' | cut -c1-160))")
            count=$(find "$run/meet" -maxdepth 1 -name '?-result.txt' 2> /dev/null | wc -l)
            (( count == copies )) || problems+=("$count results of $copies copies")
            if [[ $name == measure-* && $run != "$(cat "$RUNNER_TEMP/loopback-run" 2> /dev/null)" ]]; then
              part="call $(cut -d, -f1-3 "$run/settings.txt" | sed 's/^copies //; s/,//g')"
              if (( ${#problems[@]} == 0 )); then
                results+=("$part|pass|$name")
              else
                results+=("$part|fail|$name: ${problems[*]}")
              fi
            elif (( ${#problems[@]} > 0 )); then
              results+=("run folder $name|fail|${problems[*]}")
            fi
          done
          # Crashes since the lab started.
          if [[ -n ${LAB_START:-} ]]; then
            crashes=$(coredumpctl --no-pager list --since "@$LAB_START" 2> /dev/null | grep -i fogata)
            segfaults=$(sudo journalctl -k --no-pager --since "@$LAB_START" 2> /dev/null | grep -i segfault)
            cores=$( (find "$CALL_LAB_RUNS" -type f; find "$GITHUB_WORKSPACE" -maxdepth 1 -type f) |
              grep -E '/core(\.[0-9]+)?$')
            echo "coredumpctl:"; coredumpctl --no-pager list --since "@$LAB_START" 2>&1 | head -n 40
            echo "kernel log, segfaults:"; echo "${segfaults:-none}" | head -n 40
            echo "core files:"; echo "${cores:-none}"
            if [[ -z $crashes$segfaults$cores ]]; then
              results+=("no crash of the application|pass|")
            else
              results+=("no crash of the application|fail|$(echo "$crashes$segfaults$cores" | head -n 1 | tr '|' ':' | cut -c1-200)")
            fi
          fi
          # Every part that should have been there.
          expected=("release build" "release checks of the bundle" "native tests"
            "profile build of the call test" "debug build of the call test")
          for check in media devices alone late muted unplug switch broken hang noise; do
            expected+=("mic $check")
          done
          expected+=("mic late (quantum free)" "mic rejoin (profile)" "screen sound with a loopback"
            "call 4 camera 60 s" "call 4 screen 60 s" "call 4 screen 90 s" "call 6 screen 90 s"
            "no crash of the application")
          for part in "${expected[@]}"; do
            printf '%s\n' "${results[@]}" | grep -q "^$part|" || results+=("$part|not run|")
          done
          {
            echo "### Call checks at $GITHUB_SHA"
            echo
            echo "| part | result | |"
            echo "|---|---|---|"
            for line in "${results[@]}"; do
              IFS='|' read -r part result note <<< "$line"
              echo "| $part | $result | $note |"
            done
            echo
          } | tee -a "$GITHUB_STEP_SUMMARY"
          for line in "${results[@]}"; do
            [[ $line == *"|pass|"* ]] || failed=1
          done
          measures=()
          for run in "$CALL_LAB_RUNS"/measure-*/; do
            [[ -d $run ]] && measures+=("${run%/}")
          done
          if (( ${#measures[@]} > 0 )); then
            {
              echo "#### The calls (tools/call-lab/sum.py)"
              echo
              python3 -I tools/call-lab/sum.py "${measures[@]}"
              echo
              python3 -I tools/call-lab/sum.py --copies "${measures[@]}"
            } | tee -a "$GITHUB_STEP_SUMMARY" || echo "::warning::sum.py failed"
          fi
          # The copies' data folders and the sound sessions are not part of the record.
          # The sound daemons' logs are kept.
          for run in "$CALL_LAB_RUNS"/*/; do
            [[ -d $run ]] || continue
            for log in "${run}"session/*.log; do
              [[ -f $log ]] && cp "$log" "${run}session-$(basename "$log")"
            done
            rm -rf "${run}data" "${run}session"
          done
          cp "$PARTS" "$CALL_LAB_RUNS/parts.txt" 2> /dev/null || true
          (( failed == 0 )) || { echo "::error::not every part passed"; exit 1; }

      - name: Keep the run folders
        if: always() && env.CALL_LAB_RUNS != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: call-checks
          path: ${{ env.CALL_LAB_RUNS }}
          if-no-files-found: warn
          retention-days: 30
